name: Feature request
description: Propose an enhancement to JS Bay or a platform SDK
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the change you propose. Large design work should start with an issue before a large PR — see [CONTRIBUTING.md](https://github.com/js-bay/jsbay/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: API shape, behavior, or docs you would like. Sketches and alternatives welcome.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Core ABI / Zig
        - Apple SDK
        - Android SDK
        - Harmony SDK
        - .NET SDK
        - Tooling / CI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or rejected.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
