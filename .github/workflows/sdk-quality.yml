# SDK quality — Harmony opt-in only.
# Portable (Linux) and Apple checks are folded into CI's linux / macos jobs
# (aggressive one-job-per-platform aggregation). See docs/testing.md#ci.
name: SDK quality

on:
  workflow_dispatch:
    inputs:
      harmony:
        description: Run official Harmony lint on a provisioned SDK 12 runner
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harmony:
    # Official Code Linter/ETS are not present on GitHub-hosted images. This opt-in job requires a runner provisioned as documented in sdk/QUALITY.md.
    if: inputs.harmony
    runs-on: [self-hosted, jsbay-harmony-sdk12]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: tiangong-dev/pawl@v0.8.2
        with:
          version: v0.8.2
      - name: Official ETS format and lint
        run: make check CHECKS=native-format,harmony-style
