# SDK quality checks for public sources and the official Harmony toolchain.
name: SDK quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      harmony:
        description: Run the optional SDK 12 HAR build on a provisioned Harmony runner
        type: boolean
        default: false
      harmony_hosted:
        description: Try the Harmony HAR build on a GitHub-hosted runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harmony-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.harmony_hosted
    name: Experimental hosted Harmony HAR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [quickjs_ng, quickjs]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - name: Install Harmony command-line tools
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: 5.0.13.200
          cache: true
      - name: Install OpenHarmony API 12 SDK
        id: ohos
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad
        with:
          version: 5.0.0
          mirror: false
      - name: Check toolchain and build HAR
        timeout-minutes: 10
        env:
          QUICKJS_BACKEND: ${{ matrix.backend }}
          API12_SDK: ${{ steps.ohos.outputs.ohos-base-sdk-home }}
          HARMONY_TARGET_SDK_VERSION: '5.0.0(12)'
        run: |
          set -euo pipefail
          ohpm --version
          command -v hvigorw
          test '${{ steps.ohos.outputs.api-version }}' = 12
          test -d "$API12_SDK/native/sysroot"
          node tests/harmony-sdk/prepare-ohpm-package-test.mjs
          node scripts/prepare-harmony-ohpm.mjs "$PWD" "$QUICKJS_BACKEND" 0.1.1-rc.1
          zig build -Dbackend="$QUICKJS_BACKEND" -Dtarget=aarch64-linux-ohos -Dohos-sysroot="$API12_SDK/native/sysroot" -Dlibrary-only=true -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/harmony-core" --summary all
          export JSBAY_LIBRARY="$RUNNER_TEMP/harmony-core/lib/libjsbay.a"
          export JSBAY_HARMONY_ARCHIVE="$JSBAY_LIBRARY"
          export AR="$API12_SDK/native/llvm/bin/llvm-ar"
          printf '#!/usr/bin/env bash\nexec "%s" "$@" --no-daemon -p buildMode=release\n' "$(command -v hvigorw)" > "$RUNNER_TEMP/hvigorw-ci"
          chmod +x "$RUNNER_TEMP/hvigorw-ci"
          export HVIGORW="$RUNNER_TEMP/hvigorw-ci"
          unset NODE_PATH
          output="$RUNNER_TEMP/harmony-har-${QUICKJS_BACKEND}"
          bash scripts/stage-harmony-har.sh "$output" "0.1.1-rc.1"
          har="$output/jsbay-0.1.1-rc.1-harmony-${QUICKJS_BACKEND}-arm64-v8a.har"
          tar -xOzf "$har" package/oh-package.json5 | jq -e --arg name "@jsbay/${QUICKJS_BACKEND}" '.name == $name and .version == "0.1.1-rc.1" and .metadata.debug == false'
          for file in README.md LICENSE CHANGELOG.md; do test "$(tar -xOzf "$har" "package/$file" | wc -c)" -gt 0; done
      - name: Preserve HAR
        uses: actions/upload-artifact@v6
        with:
          name: harmony-hosted-${{ matrix.backend }}
          path: ${{ runner.temp }}/harmony-har-${{ matrix.backend }}
          if-no-files-found: error

  harmony-toolchain:
    name: Harmony local gate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test Harmony toolchain resolution
        run: |
          bash tests/harmony-sdk/toolchain-resolver.sh
          bash tests/ci/harmony-required-gate.sh
          bash tests/ci/harmony-local-gate.sh

  harmony-manual-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.harmony
    name: Optional Harmony runner preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check runner readiness setting
        env:
          HARMONY_SDK12_READY: ${{ vars.HARMONY_SDK12_READY }}
        run: bash scripts/check-harmony-runner-readiness.sh "$HARMONY_SDK12_READY"

  harmony:
    if: github.event_name == 'workflow_dispatch' && inputs.harmony
    needs: [harmony-toolchain, harmony-manual-preflight]
    runs-on: [self-hosted, jsbay-harmony-sdk12]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [quickjs_ng, quickjs]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: tiangong-dev/pawl@v0.8.2
        with:
          version: v0.8.2
      - name: Official ETS format and lint
        run: make check CHECKS=native-format,harmony-style
      - name: Build and package HAR
        env:
          QUICKJS_BACKEND: ${{ matrix.backend }}
          HARMONY_TARGET_SDK_VERSION: '5.0.0(12)'
        run: |
          set -euo pipefail
          source scripts/harmony-toolchain.sh
          harmony_toolchain_resolve
          native="$OHOS_NATIVE_HOME"
          zig build -Dbackend="$QUICKJS_BACKEND" -Dtarget=aarch64-linux-ohos -Dohos-sysroot="$native/sysroot" -Dlibrary-only=true -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/harmony-core" --summary all
          export JSBAY_LIBRARY="$RUNNER_TEMP/harmony-core/lib/libjsbay.a"
          export JSBAY_HARMONY_ARCHIVE="$JSBAY_LIBRARY"
          : "${NODE_PATH:?configure the matching Hvigor module root on this runner}"
          bash tests/harmony-sdk/style-consumer.sh
          bash tests/benchmark_interop_contract.sh --arkts-only
          bash scripts/stage-harmony-har.sh "$RUNNER_TEMP/harmony-har-${{ matrix.backend }}" "ci-${{ matrix.backend }}-${GITHUB_SHA:0:12}"
      - name: Preserve the validated HAR
        uses: actions/upload-artifact@v6
        with:
          name: harmony-sdk-quality-${{ matrix.backend }}
          path: ${{ runner.temp }}/harmony-har-${{ matrix.backend }}
          if-no-files-found: error
