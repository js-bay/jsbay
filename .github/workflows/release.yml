          build_library() {
            zig build \
              -Dbackend=quickjs \
              -Doptimize=ReleaseFast \
              -Dlibrary-only=true \
              "$@" \
              --summary all
          }
          if [ "true" = true ]; then
            sysroot="$(xcrun --sdk macosx --show-sdk-path)"
            test -d "$sysroot"
            build_library "-Dtarget=x86_64-macos.11.0" "-Dapple-sysroot=$sysroot"
          else
            build_library "-Dtarget=x86_64-macos.11.0"
          fi

      - name: Pack artifact quickjs (macos-x86_64)
        id: pack_qjs
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          name="jsbay-${ver}-macos-x86_64-quickjs"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/lib" "$stage/include"
          if [ -f zig-out/lib/libjsbay.a ]; then
            cp zig-out/lib/libjsbay.a "$stage/lib/"
          elif [ -f zig-out/lib/jsbay.lib ]; then
            cp zig-out/lib/jsbay.lib "$stage/lib/"
          else
            echo "No libjsbay.a / jsbay.lib under zig-out/lib:"
            ls -la zig-out/lib || true
            exit 1
          fi
          cp include/jsbay*.h include/module.modulemap "$stage/include/"
          cp zig-out/include/jsbay.h "$stage/include/jsbay.h" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          printf '%s\n' "$ver" > "$stage/VERSION"
          printf '%s\n' "${{ github.sha }}" > "$stage/COMMIT"
          printf '%s\n' "quickjs" > "$stage/backend"
          archive="$name.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$name"
          tar -tzf "$archive" | grep -Fx "$name/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run consumers from desktop archive (quickjs / macos-x86_64)
        shell: bash
        run: bash tests/ci/release-desktop-consumer.sh "${{ steps.pack_qjs.outputs.archive }}" "${{ steps.ver.outputs.label }}" "${{ github.sha }}" "quickjs"

      - name: Upload build artifact (quickjs / macos-x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_qjs.outputs.name }}
          path: ${{ steps.pack_qjs.outputs.archive }}
          if-no-files-found: error

      - name: Build library jsc (macos-x86_64)
        shell: bash
        run: |
          set -euo pipefail
          build_library() {
            zig build \
              -Dbackend=jsc \
              -Doptimize=ReleaseFast \
              -Dlibrary-only=true \
              "$@" \
              --summary all
          }
          if [ "true" = true ]; then
            sysroot="$(xcrun --sdk macosx --show-sdk-path)"
            test -d "$sysroot"
            build_library "-Dtarget=x86_64-macos.11.0" "-Dapple-sysroot=$sysroot"
          else
            build_library "-Dtarget=x86_64-macos.11.0"
          fi

      - name: Pack artifact jsc (macos-x86_64)
        id: pack_jsc
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          name="jsbay-${ver}-macos-x86_64-jsc"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/lib" "$stage/include"
          if [ -f zig-out/lib/libjsbay.a ]; then
            cp zig-out/lib/libjsbay.a "$stage/lib/"
          elif [ -f zig-out/lib/jsbay.lib ]; then
            cp zig-out/lib/jsbay.lib "$stage/lib/"
          else
            echo "No libjsbay.a / jsbay.lib under zig-out/lib:"
            ls -la zig-out/lib || true
            exit 1
          fi
          cp include/jsbay*.h include/module.modulemap "$stage/include/"
          cp zig-out/include/jsbay.h "$stage/include/jsbay.h" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          printf '%s\n' "$ver" > "$stage/VERSION"
          printf '%s\n' "${{ github.sha }}" > "$stage/COMMIT"
          printf '%s\n' "jsc" > "$stage/backend"
          archive="$name.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$name"
          tar -tzf "$archive" | grep -Fx "$name/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run consumers from desktop archive (jsc / macos-x86_64)
        shell: bash
        run: bash tests/ci/release-desktop-consumer.sh "${{ steps.pack_jsc.outputs.archive }}" "${{ steps.ver.outputs.label }}" "${{ github.sha }}" "jsc"

      - name: Upload build artifact (jsc / macos-x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_jsc.outputs.name }}
          path: ${{ steps.pack_jsc.outputs.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # L2 — Apple XCFramework (quickjs_ng, quickjs, jsc sequential; skips if input false)
  # ---------------------------------------------------------------------------
  build-apple:
    name: L2 Apple XCFramework
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apple }}
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Resolve version label
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          label="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Show Apple SDKs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Build JsBay.xcframework (quickjs_ng)
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.label }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./build-apple.sh quickjs_ng
          grep -Fx 'PASS: iOS Simulator consumer smoke' build-apple/consumer-probes/ios-simulator-consumer.status

      - name: Pack XCFramework zip (quickjs_ng)
        id: pack_qjsng
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          backend="quickjs_ng"
          name="jsbay-${ver}-apple-${backend}"
          archive="${name}-JsBay.xcframework.zip"
          zig build tool -- package-apple-release "$ver" "$backend" "${{ github.sha }}" "$GITHUB_WORKSPACE/$archive"
          unzip -Z1 "$archive" | grep -Fx "$name/Package.swift"
          unzip -Z1 "$archive" | grep -Fx "$name/Sources/JsBaySDK/"
          unzip -Z1 "$archive" | grep -Fx "$name/Frameworks/JsBay.xcframework/"
          unzip -Z1 "$archive" | grep -Fx "$name/LICENSE"
          unzip -Z1 "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test Apple Git package consumer (quickjs_ng)
        shell: bash
        run: bash tests/apple-sdk/git-package-consumer.sh "$GITHUB_WORKSPACE/${{ steps.pack_qjsng.outputs.archive }}" "$RUNNER_TEMP/apple-git-consumer-qjsng"

      - name: Upload Apple artifact (quickjs_ng)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_qjsng.outputs.name }}
          path: ${{ steps.pack_qjsng.outputs.archive }}
          if-no-files-found: error

      - name: Build JsBay.xcframework (quickjs)
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.label }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./build-apple.sh quickjs
          grep -Fx 'PASS: iOS Simulator consumer smoke' build-apple/consumer-probes/ios-simulator-consumer.status

      - name: Pack XCFramework zip (quickjs)
        id: pack_qjs
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          backend="quickjs"
          name="jsbay-${ver}-apple-${backend}"
          archive="${name}-JsBay.xcframework.zip"
          zig build tool -- package-apple-release "$ver" "$backend" "${{ github.sha }}" "$GITHUB_WORKSPACE/$archive"
          unzip -Z1 "$archive" | grep -Fx "$name/Package.swift"
          unzip -Z1 "$archive" | grep -Fx "$name/Sources/JsBaySDK/"
          unzip -Z1 "$archive" | grep -Fx "$name/Frameworks/JsBay.xcframework/"
          unzip -Z1 "$archive" | grep -Fx "$name/LICENSE"
          unzip -Z1 "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test Apple Git package consumer (quickjs)
        shell: bash
        run: bash tests/apple-sdk/git-package-consumer.sh "$GITHUB_WORKSPACE/${{ steps.pack_qjs.outputs.archive }}" "$RUNNER_TEMP/apple-git-consumer-qjs"

      - name: Upload Apple artifact (quickjs)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_qjs.outputs.name }}
          path: ${{ steps.pack_qjs.outputs.archive }}
          if-no-files-found: error

      - name: Build JsBay.xcframework (jsc)
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.label }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./build-apple.sh jsc
          grep -Fx 'PASS: iOS Simulator consumer smoke' build-apple/consumer-probes/ios-simulator-consumer.status

      - name: Pack XCFramework zip (jsc)
        id: pack_jsc
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          backend="jsc"
          name="jsbay-${ver}-apple-${backend}"
          archive="${name}-JsBay.xcframework.zip"
          zig build tool -- package-apple-release "$ver" "$backend" "${{ github.sha }}" "$GITHUB_WORKSPACE/$archive"
          unzip -Z1 "$archive" | grep -Fx "$name/Package.swift"
          unzip -Z1 "$archive" | grep -Fx "$name/Sources/JsBaySDK/"
          unzip -Z1 "$archive" | grep -Fx "$name/Frameworks/JsBay.xcframework/"
          unzip -Z1 "$archive" | grep -Fx "$name/LICENSE"
          unzip -Z1 "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test Apple Git package consumer (jsc)
        shell: bash
        run: bash tests/apple-sdk/git-package-consumer.sh "$GITHUB_WORKSPACE/${{ steps.pack_jsc.outputs.archive }}" "$RUNNER_TEMP/apple-git-consumer-jsc"

      - name: Upload Apple artifact (jsc)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_jsc.outputs.name }}
          path: ${{ steps.pack_jsc.outputs.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # L2 — Android SDK (kept separate so dispatch can skip without failing L1 linux)
  # ---------------------------------------------------------------------------
  build-android:
    name: L2 Android SDK (${{ matrix.backend }})
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [quickjs_ng, quickjs]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Setup JDK for Android Gradle Plugin 8.7.3
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK platform and build tools
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages used by the AAR
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Resolve version label
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          label="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Build Android .so (arm64-v8a + x86_64)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          QUICKJS_BACKEND: ${{ matrix.backend }}
          RELEASE_VERSION: ${{ steps.ver.outputs.label }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          ./build-android.sh "$GITHUB_WORKSPACE/build-android/jniLibs"

      - name: Build and inspect Android AAR (core + JNI adapter)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          gradle="$RUNNER_TEMP/gradle-8.9/bin/gradle"
          test -x "$gradle"
          cd sdk/android
          env -u ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" "$gradle" --no-daemon \
            -PjsbayVersion="${{ steps.ver.outputs.label }}" \
            -PjsbayBackend="${{ matrix.backend }}" \
            -PjsbayJniLibs="$GITHUB_WORKSPACE/build-android/jniLibs" \
            :jsbay:assembleRelease
          aar=jsbay/build/outputs/aar/jsbay-release.aar
          test -f "$aar"
          unzip -p "$aar" META-INF/LICENSE | cmp - "$GITHUB_WORKSPACE/LICENSE"
          unzip -p "$aar" META-INF/THIRD_PARTY_NOTICES.md | cmp - "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md"
          actual="$RUNNER_TEMP/android-aar-members"
          unzip -Z1 "$aar" | grep '^jni/.*\.so$' | sort > "$actual"
          printf '%s\n' \
            jni/arm64-v8a/libjsbay.so \
            jni/arm64-v8a/libjsbay_android.so \
            jni/x86_64/libjsbay.so \
            jni/x86_64/libjsbay_android.so | sort | diff -u - "$actual"
          unzip -p "$aar" proguard.txt | grep -F -- '-keep class io.jsbay.Native { *; }'

      - name: Publish Android Maven repository
        id: maven
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          backend="${{ matrix.backend }}"
          case "$backend" in quickjs) artifact=jsbayquickjs ;; quickjs_ng) artifact=jsbayquickjsng ;; esac
          repo="$GITHUB_WORKSPACE/build-android/maven-repo"
          rm -rf "$repo"
          cd sdk/android
          env -u ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon \
            -PjsbayJniLibs="$GITHUB_WORKSPACE/build-android/jniLibs" \
            -PjsbayVersion="$ver" \
            -PjsbayBackend="$backend" \
            -PjsbayMavenRepo="$repo" \
            :jsbay:publishReleasePublicationToStagingRepository
          module="$repo/io/jsbay/$artifact/$ver"
          test -s "$module/$artifact-$ver.aar"
          test -s "$module/$artifact-$ver.pom"
          test -s "$module/$artifact-$ver.module"
          cmp "$module/$artifact-$ver.aar" jsbay/build/outputs/aar/jsbay-release.aar
          unzip -p "$module/$artifact-$ver.aar" META-INF/LICENSE | cmp - "$GITHUB_WORKSPACE/LICENSE"
          unzip -p "$module/$artifact-$ver.aar" META-INF/THIRD_PARTY_NOTICES.md | cmp - "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md"
          grep -F 'org.jetbrains.kotlin' "$module/$artifact-$ver.pom"
          grep -F 'kotlin-stdlib' "$module/$artifact-$ver.pom"
          zig build --build-file "$GITHUB_WORKSPACE/build.zig" tool -- check-maven "$module" "$ver" "$backend"
          mkdir -p "$GITHUB_WORKSPACE/build-android/aar"
          raw_aar="$GITHUB_WORKSPACE/build-android/aar/jsbay-${ver}-android-${backend}.aar"
          cp "$module/$artifact-$ver.aar" "$raw_aar"
          cmp "$raw_aar" "$module/$artifact-$ver.aar"
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$repo/"
          archive="jsbay-${ver}-android-${backend}-maven.zip"
          ( cd "$repo" && zip -qr "$GITHUB_WORKSPACE/$archive" io LICENSE THIRD_PARTY_NOTICES.md )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Test Android Maven retry safety
        env:
          VERSION: ${{ steps.ver.outputs.label }}
          BACKEND: ${{ matrix.backend }}
          ARCHIVE: ${{ steps.maven.outputs.archive }}
        run: node tests/android-sdk/maven-deploy-retry-test.mjs "$ARCHIVE" "$VERSION" "$BACKEND"

      - name: Test Android Maven consumer
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/jsbay-maven-consumer-repo"
          mkdir -p "$repo"
          unzip -q "${{ steps.maven.outputs.archive }}" -d "$repo"
          env -u ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            bash tests/android-sdk/maven-consumer.sh "$repo" "${{ steps.ver.outputs.label }}" "$RUNNER_TEMP/gradle-8.9/bin/gradle" "${{ matrix.backend }}"

      - name: Enable KVM for packaged Android acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the packaged Android Maven artifact on ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/ci/release-android-consumer.sh "${{ steps.maven.outputs.archive }}" "${{ steps.ver.outputs.label }}" "$RUNNER_TEMP/gradle-8.9/bin/gradle" "${{ matrix.backend }}"

      - name: Upload Android Maven repository
        uses: actions/upload-artifact@v6
        with:
          name: jsbay-${{ steps.ver.outputs.label }}-android-maven-${{ matrix.backend }}
          path: ${{ steps.maven.outputs.archive }}
          if-no-files-found: error

      - name: Upload Android AAR
        uses: actions/upload-artifact@v6
        with:
          name: jsbay-${{ steps.ver.outputs.label }}-android-aar-${{ matrix.backend }}
          path: build-android/aar/jsbay-${{ steps.ver.outputs.label }}-android-${{ matrix.backend }}.aar
          if-no-files-found: error

      - name: Pack Android artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          backend="${{ matrix.backend }}"
          name="jsbay-${ver}-android-jniLibs-${backend}"
          stage="$RUNNER_TEMP/$name"
          rm -rf "$stage"
          mkdir -p "$stage/jniLibs" "$stage/include"
          expected_abis="$RUNNER_TEMP/js-bay-android-abis.expected"
          actual_abis="$RUNNER_TEMP/js-bay-android-abis.actual"
          printf '%s\n' arm64-v8a x86_64 > "$expected_abis"
          find build-android/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > "$actual_abis"
          diff -u "$expected_abis" "$actual_abis"
          for abi in arm64-v8a x86_64; do
            test -f "build-android/jniLibs/$abi/libjsbay.so"
            mkdir -p "$stage/jniLibs/$abi"
            cp "build-android/jniLibs/$abi/libjsbay.so" "$stage/jniLibs/$abi/"
          done
          cp include/jsbay*.h "$stage/include/"
          # Export only reviewed, tracked Android SDK sources. Gradle writes
          # .gradle/ and build/ below sdk/android during the AAR build.
          sdk_archive="$RUNNER_TEMP/js-bay-android-sdk.tar"
          git archive --format=tar HEAD -- sdk/android > "$sdk_archive"
          tar -xf "$sdk_archive" -C "$stage"
          mv "$stage/sdk/android" "$stage/android-sdk"
          rmdir "$stage/sdk"
          mkdir -p "$stage/android-sdk/include"
          cp include/jsbay*.h "$stage/android-sdk/include/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/android-sdk/"
          printf '%s\n' "$ver" > "$stage/VERSION"
          printf '%s\n' "${{ github.sha }}" > "$stage/COMMIT"
          printf '%s\n' "$backend" > "$stage/backend"
          archive="$name.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$name"
          tar -tzf "$archive" | grep -Fx "$name/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          tar -tzf "$archive" | grep -Fx "$name/android-sdk/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/android-sdk/THIRD_PARTY_NOTICES.md"
          if tar -tzf "$archive" | grep -E "$name/android-sdk/(.*/)?(\.gradle|build|local\.properties)(/|$)"; then
            echo "Android SDK archive contains generated or local files" >&2
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Assemble assets under read-only permissions before any release tag or package is published.
  # ---------------------------------------------------------------------------
  assemble-release-assets:
    name: Assemble checked release assets
    needs: [build-libs-linux, build-libs-linux-arm, build-libs-macos, build-libs-macos-intel, build-apple, build-android]
    # Build-only runs may skip either L2 tier; release publication validates that both were selected and succeeded.
    if: >-
      ${{ always() &&
          needs.build-libs-linux.result == 'success' &&
          needs.build-libs-linux-arm.result == 'success' &&
          needs.build-libs-macos.result == 'success' &&
          needs.build-libs-macos-intel.result == 'success' &&
          ((inputs.build_apple && needs.build-apple.result == 'success') ||
           (!inputs.build_apple && needs.build-apple.result == 'skipped')) &&
          ((inputs.build_android && needs.build-android.result == 'success') ||
           (!inputs.build_android && needs.build-android.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed source snapshot
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Install source-privacy checker dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Export history-free source archive
        id: source
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          archive="$RUNNER_TEMP/jsbay-${version}-source.tar.gz"
          zig build tool -- export-public-source "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Pack and test Zig source dependency
        id: zig_package
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          archive="$RUNNER_TEMP/jsbay-${version}-zig.tar.gz"
          bash tests/ci/pack-zig-source.sh "${{ steps.source.outputs.archive }}" "$archive"
          bash tests/ci/release-zig-consumer.sh "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Flatten and checksum
        id: sum
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          mkdir -p release-assets
          find dist -type f \( -name 'jsbay-*.tar.gz' -o -name 'jsbay-*.zip' -o -name 'jsbay-*.aar' \) -exec cp {} release-assets/ \;
          cp "${{ steps.source.outputs.archive }}" release-assets/
          cp "${{ steps.zig_package.outputs.archive }}" release-assets/
          cd release-assets
          ls -la
          zig build --build-file "$GITHUB_WORKSPACE/build.zig" tool -- check-release-assets \
            "$PWD" \
            "$version" \
            "${{ github.event_name != 'workflow_dispatch' || inputs.build_apple }}" \
            "${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}"
          : > SHA256SUMS
          for f in jsbay-*.tar.gz jsbay-*.zip jsbay-*.aar; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Upload checked archives
        uses: actions/upload-artifact@v6
        with:
          name: jsbay-release-assets
          path: release-assets/
          if-no-files-found: error


  prepare-swift-package-release-assets:
    name: Prepare and test the single Swift package
    needs: [assemble-release-assets]
    if: ${{ always() && inputs.build_apple && needs.assemble-release-assets.result == 'success' }}
    runs-on: macos-26
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Download checked release assets
        uses: actions/download-artifact@v4
        with:
          name: jsbay-release-assets
          path: release-assets
      - name: Prepare and validate single Swift package
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/swift-package-release"
          bash scripts/prepare-swift-package-release.sh release-assets "$VERSION" "$SOURCE_SHA" "$output"
          for archive in \
            "jsbay-${VERSION}-apple-quickjs-JsBayQuickJS.xcframework.zip" \
            "jsbay-${VERSION}-apple-quickjs_ng-JsBayQuickJSNG.xcframework.zip" \
            "jsbay-${VERSION}-apple-jsc-JsBayJavaScriptCore.xcframework.zip"; do
            test -s "release-assets/$archive"
          done
          bash tests/apple-sdk/single-package-consumer.sh release-assets "$VERSION" "$SOURCE_SHA" "$output"
          test -s "$output/Package.swift"
          cd release-assets
          : > SHA256SUMS
          for archive in jsbay-*.tar.gz jsbay-*.zip jsbay-*.aar; do
            [ -f "$archive" ] || continue
            shasum -a 256 "$archive" >> SHA256SUMS
          done
      - name: Upload final checked release assets
        uses: actions/upload-artifact@v6
        with:
          name: jsbay-final-release-assets
          path: release-assets/
          if-no-files-found: error
      - name: Upload generated Swift package metadata
        uses: actions/upload-artifact@v6
        with:
          name: jsbay-swift-package
          path: ${{ runner.temp }}/swift-package-release/
          if-no-files-found: error

  validate-release-request:
    name: Validate release request and reserve no existing version
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source snapshot for authenticated remote tag check
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - name: Validate complete release selection and unused tag
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "${{ inputs.build_apple }}" = true || { echo 'Publishing requires the Apple build' >&2; exit 1; }
          test "${{ inputs.build_android }}" = true || { echo 'Publishing requires the Android build' >&2; exit 1; }
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN is required for publishing' >&2; exit 1; }
          resolved="$(zig build tool -- release-version "$VERSION" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          test "$resolved" = "$VERSION"
          tag="v$VERSION"
          existing="$(git ls-remote --refs origin "refs/tags/$tag")"
          if [ -n "$existing" ] && [ "$RUN_ATTEMPT" = 1 ]; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

  publish-android-packages:
    name: Publish Android package (${{ matrix.backend }})
    needs: [assemble-release-assets, validate-release-request, prepare-swift-package-release, create-draft-release]
    if: ${{ always() && inputs.publish && needs.assemble-release-assets.result == 'success' && needs.validate-release-request.result == 'success' && needs.prepare-swift-package-release.result == 'success' && needs.create-draft-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: [quickjs_ng, quickjs]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/download-artifact@v4
        with:
          name: jsbay-release-assets
          path: release-assets
      - name: Publish the checked Maven package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND: ${{ matrix.backend }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          bash scripts/publish-android-maven.sh \
            "release-assets/jsbay-${version}-android-${BACKEND}-maven.zip" \
            "$version" "$BACKEND" "https://maven.pkg.github.com/$GITHUB_REPOSITORY" github

  prepare-swift-package-release:
    name: Stage immutable Swift package commit
    needs: [assemble-release-assets, validate-release-request, prepare-swift-package-release-assets]
    if: ${{ always() && inputs.publish && needs.assemble-release-assets.result == 'success' && needs.validate-release-request.result == 'success' && needs.prepare-swift-package-release-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download generated Swift package metadata
        uses: actions/download-artifact@v4
        with:
          name: jsbay-swift-package
          path: ${{ runner.temp }}/swift-package-release
      - name: Verify generated Swift package metadata
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/swift-package-release"
          test -s "$output/Package.swift"
      - name: Commit package metadata and create version tag
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          JSBAY_PACKAGE_REF: refs/heads/jsbay-package-staging-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/swift-package-release"
          bash scripts/create-swift-package-tag.sh "$output" "$VERSION" "$SOURCE_SHA"

  create-draft-release:
    name: Create draft release with checked assets
    needs: [assemble-release-assets, prepare-swift-package-release, build-node-packages]
    if: ${{ always() && inputs.publish && needs.assemble-release-assets.result == 'success' && needs.prepare-swift-package-release.result == 'success' && needs.build-node-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download checked archives
        uses: actions/download-artifact@v4
        with:
          name: jsbay-final-release-assets
          path: release-assets

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: jsbay-swift-package
          path: ${{ runner.temp }}/swift-package-release
      - name: Create or verify draft release without replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: node scripts/github-release.mjs draft "$VERSION" "jsbay-package-staging-$GITHUB_RUN_ID" release-assets "$RUNNER_TEMP/swift-package-release"

  build-node-packages:
    needs: [validate-release-request]
    if: ${{ always() && (!inputs.publish || needs.validate-release-request.result == 'success') }}
    uses: ./.github/workflows/npm-packages.yml
    with:
      operation: build
      tag: v${{ inputs.version }}

  publish-node-packages:
    needs: [create-draft-release, build-node-packages, publish-android-packages]
    if: ${{ always() && inputs.publish && needs.create-draft-release.result == 'success' && needs.build-node-packages.result == 'success' && needs.publish-android-packages.result == 'success' }}
    uses: ./.github/workflows/npm-packages.yml
    with:
      operation: publish
      tag: v${{ inputs.version }}
      artifact_id: ${{ needs.build-node-packages.outputs.artifact_id }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: [create-draft-release, publish-node-packages]
    if: ${{ always() && inputs.publish && needs.create-draft-release.result == 'success' && needs.publish-node-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: jsbay-final-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: jsbay-swift-package
          path: ${{ runner.temp }}/swift-package-release
      - name: Verify assets and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stage_ref="refs/heads/jsbay-package-staging-$GITHUB_RUN_ID"
          stage_sha="$(git ls-remote --refs origin "$stage_ref" | cut -f1)"
          test -n "$stage_sha"
          tag_ref="refs/tags/v$VERSION"
          existing_sha="$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk 'END {print $1}')"
          test -z "$existing_sha" || test "$existing_sha" = "$stage_sha"
          node scripts/github-release.mjs publish "$VERSION" "jsbay-package-staging-$GITHUB_RUN_ID" release-assets "$RUNNER_TEMP/swift-package-release"
          tag_sha="$(git ls-remote origin "$tag_ref" "$tag_ref^{}" | awk 'END {print $1}')"
          test "$tag_sha" = "$stage_sha"

  verify-published-swift:
    name: Verify published Swift package downloads
    needs: [publish-release]
    if: ${{ always() && inputs.publish && needs.publish-release.result == 'success' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: jsbay-swift-package
          path: ${{ runner.temp }}/swift-package-release
      - name: Download and run all published Swift and Objective-C products
        env:
          VERSION: ${{ inputs.version }}
        run: bash tests/apple-sdk/remote-package-consumer.sh "$RUNNER_TEMP/swift-package-release" "$VERSION"
