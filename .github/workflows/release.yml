# JS Bay release — L1 desktop static libs + L2 Apple/Android when buildable. Tiers and exclusions: docs/testing.md#ci. Never upload empty XCFramework / fake .so.
# Aggressive aggregation: one L1 job per runner image; Apple L2 backends run sequentially in one macos job.
# assemble + publish stay separate (artifact gate / contents:write).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 0.1.0); defaults to tag or run id"
        required: false
        type: string
      build_android:
        description: "Build Android jniLibs (needs NDK setup on Ubuntu)"
        required: false
        type: boolean
        default: true
      build_apple:
        description: "Build Apple JsBay.xcframework on macOS"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # L1 — desktop static libraries (one job per runner image)
  # ---------------------------------------------------------------------------
  build-libs-linux:
    name: L1 linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Resolve version label
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          label="$(zig build tool -- release-version "$VERSION_INPUT" "$GITHUB_REF" "$GITHUB_RUN_ID")"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Build library quickjs_ng (linux-x86_64)
        shell: bash
        run: |
          set -euo pipefail
          build_library() {
            zig build \
              -Dbackend=quickjs_ng \
              -Doptimize=ReleaseFast \
              -Dlibrary-only=true \
              "$@" \
              --summary all
          }
          if [ "false" = true ]; then
            sysroot="$(xcrun --sdk macosx --show-sdk-path)"
            test -d "$sysroot"
            build_library "-Dtarget=x86_64-linux-gnu" "-Dapple-sysroot=$sysroot"
          else
            build_library "-Dtarget=x86_64-linux-gnu"
          fi

      - name: Pack artifact quickjs_ng (linux-x86_64)
        id: pack_qjsng
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          name="jsbay-${ver}-linux-x86_64-quickjs_ng"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/lib" "$stage/include"
          if [ -f zig-out/lib/libjsbay.a ]; then
            cp zig-out/lib/libjsbay.a "$stage/lib/"
          elif [ -f zig-out/lib/jsbay.lib ]; then
            cp zig-out/lib/jsbay.lib "$stage/lib/"
          else
            echo "No libjsbay.a / jsbay.lib under zig-out/lib:"
            ls -la zig-out/lib || true
            exit 1
          fi
          cp include/jsbay*.h include/module.modulemap "$stage/include/"
          cp zig-out/include/jsbay.h "$stage/include/jsbay.h" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          printf '%s\n' "$ver" > "$stage/VERSION"
          printf '%s\n' "${{ github.sha }}" > "$stage/COMMIT"
          printf '%s\n' "quickjs_ng" > "$stage/backend"
          archive="$name.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$name"
          tar -tzf "$archive" | grep -Fx "$name/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run consumers from desktop archive (quickjs_ng / linux-x86_64)
        shell: bash
        run: bash tests/ci/release-desktop-consumer.sh "${{ steps.pack_qjsng.outputs.archive }}" "${{ steps.ver.outputs.label }}" "${{ github.sha }}" "quickjs_ng"

      - name: Upload build artifact (quickjs_ng / linux-x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_qjsng.outputs.name }}
          path: ${{ steps.pack_qjsng.outputs.archive }}
          if-no-files-found: error

      - name: Build library quickjs (linux-x86_64)
        shell: bash
        run: |
          set -euo pipefail
          build_library() {
            zig build \
              -Dbackend=quickjs \
              -Doptimize=ReleaseFast \
              -Dlibrary-only=true \
              "$@" \
              --summary all
          }
          if [ "false" = true ]; then
            sysroot="$(xcrun --sdk macosx --show-sdk-path)"
            test -d "$sysroot"
            build_library "-Dtarget=x86_64-linux-gnu" "-Dapple-sysroot=$sysroot"
          else
            build_library "-Dtarget=x86_64-linux-gnu"
          fi

      - name: Pack artifact quickjs (linux-x86_64)
        id: pack_qjs
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.label }}"
          name="jsbay-${ver}-linux-x86_64-quickjs"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/lib" "$stage/include"
          if [ -f zig-out/lib/libjsbay.a ]; then
            cp zig-out/lib/libjsbay.a "$stage/lib/"
          elif [ -f zig-out/lib/jsbay.lib ]; then
            cp zig-out/lib/jsbay.lib "$stage/lib/"
          else
            echo "No libjsbay.a / jsbay.lib under zig-out/lib:"
            ls -la zig-out/lib || true
            exit 1
          fi
          cp include/jsbay*.h include/module.modulemap "$stage/include/"
          cp zig-out/include/jsbay.h "$stage/include/jsbay.h" 2>/dev/null || true
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          printf '%s\n' "$ver" > "$stage/VERSION"
          printf '%s\n' "${{ github.sha }}" > "$stage/COMMIT"
          printf '%s\n' "quickjs" > "$stage/backend"
          archive="$name.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$name"
          tar -tzf "$archive" | grep -Fx "$name/LICENSE"
          tar -tzf "$archive" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run consumers from desktop archive (quickjs / linux-x86_64)
        shell: bash
        run: bash tests/ci/release-desktop-consumer.sh "${{ steps.pack_qjs.outputs.archive }}" "${{ steps.ver.outputs.label }}" "${{ github.sha }}" "quickjs"

      - name: Upload build artifact (quickjs / linux-x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack_qjs.outputs.name }}
          path: ${{ steps.pack_qjs.outputs.archive }}
          if-no-files-found: error

