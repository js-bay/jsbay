name: Extended tests

# Aggressive aggregation: one large job per runner image.
# Triggers: daily schedule + manual dispatch (not PR). See docs/testing.md#ci.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4

      - name: Native engine + consumers (quickjs_ng / ReleaseSafe)
        env:
          JSBAY_CI_OPTIMIZE: ReleaseSafe
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs_ng -Doptimize=ReleaseSafe --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs_ng

      - name: Native engine + consumers (quickjs / ReleaseSafe)
        env:
          JSBAY_CI_OPTIMIZE: ReleaseSafe
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs -Doptimize=ReleaseSafe --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs

      - name: Stress — concurrency and lifecycle (quickjs_ng)
        run: zig build test-engine -Dbackend=quickjs_ng -Dstress-tests=true --summary all

      - name: Stress — GC lifecycle contracts (quickjs_ng)
        run: |
          set -euo pipefail
          for filter in 'reference' 'finalizer contract:' 'self-driven loop:'; do
            zig build test-engine -Dbackend=quickjs_ng -Dquickjs-gc-stress=true -Dtest-filter="$filter" --summary all
          done

      - name: Stress — OOM contracts (quickjs_ng)
        run: zig build test-engine -Dbackend=quickjs_ng -Dtest-filter=OOM --summary all

      - name: Stress — concurrency and lifecycle (quickjs)
        run: zig build test-engine -Dbackend=quickjs -Dstress-tests=true --summary all

      - name: Stress — GC lifecycle contracts (quickjs)
        run: |
          set -euo pipefail
          for filter in 'reference' 'finalizer contract:' 'self-driven loop:'; do
            zig build test-engine -Dbackend=quickjs -Dquickjs-gc-stress=true -Dtest-filter="$filter" --summary all
          done

      - name: Stress — OOM contracts (quickjs)
        run: zig build test-engine -Dbackend=quickjs -Dtest-filter=OOM --summary all

      - name: zev wait/notification contention
        working-directory: libs/zev
        run: zig build stress --summary all

      - name: zev ThreadSanitizer
        working-directory: libs/zev
        run: zig build test stress -Dtsan=true --summary all

      - name: Install Android build and emulator dependencies (API 24 + 35)
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-24;google_apis;x86_64' 'system-images;android-35;google_apis;x86_64'

      - name: Download Gradle 8.9
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gradle-8.9/bin/gradle"

      - name: Test Android smoke builder staging
        run: ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0" KOTLIN_GRADLE_LIB="$RUNNER_TEMP/gradle-8.9/lib" bash tests/ci/android-smoke-builder-test.sh

      - name: Build Android core and JNI adapter (smoke)
        run: |
          set -euo pipefail
          ANDROID_SMOKE_BUILD_ONLY=true GRADLE_BIN="$RUNNER_TEMP/gradle-8.9/bin/gradle" bash tests/ci/run-android-device-smoke.sh

      - name: Enable KVM for the Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android ART and R8 consumers (API 24)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ANDROID_SMOKE_SKIP_BUILD=true
            ANDROID_SMOKE_JNI_LIBS="$GITHUB_WORKSPACE/build-android/jniLibs"
            GRADLE_BIN="$RUNNER_TEMP/gradle-8.9/bin/gradle"
            ANDROID_R8_TEST_OUT="$RUNNER_TEMP/jsbay-android-r8-api24"
            ANDROID_R8_TEST_REMOTE='/data/local/tmp/jsbay-android-r8'
            bash tests/ci/run-android-device-smoke.sh

      - name: Android ART and R8 consumers (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ANDROID_SMOKE_SKIP_BUILD=true
            ANDROID_SMOKE_JNI_LIBS="$GITHUB_WORKSPACE/build-android/jniLibs"
            GRADLE_BIN="$RUNNER_TEMP/gradle-8.9/bin/gradle"
            ANDROID_R8_TEST_OUT="$RUNNER_TEMP/jsbay-android-r8-api35"
            ANDROID_R8_TEST_REMOTE='/data/local/tmp/jsbay-android-r8'
            bash tests/ci/run-android-device-smoke.sh

  linux-arm:
    name: linux-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Native engine + consumers (quickjs_ng / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs_ng -Doptimize=Debug --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs_ng

      - name: Independent packages on ARM64 (quickjs_ng)
        run: |
          set -euo pipefail
          for package in zev js_event_loop inspector inspector_transport bytecode_cache; do
            (cd "libs/$package" && zig build test --summary all)
          done

      - name: Native engine + consumers (quickjs / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs -Doptimize=Debug --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs

      - name: zev wait/notification contention
        working-directory: libs/zev
        run: zig build stress --summary all

  macos:
    name: macos
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Native engine + consumers (quickjs / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs -Doptimize=Debug --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs

      - name: Native engine + consumers (jsc / ReleaseSafe)
        env:
          JSBAY_CI_OPTIMIZE: ReleaseSafe
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=jsc -Doptimize=ReleaseSafe --summary all
          bash tests/ci/run-desktop-consumers.sh jsc

      - name: Stress — concurrency and lifecycle (quickjs_ng)
        run: zig build test-engine -Dbackend=quickjs_ng -Dstress-tests=true --summary all

      - name: Stress — GC lifecycle contracts (quickjs_ng)
        run: |
          set -euo pipefail
          for filter in 'reference' 'finalizer contract:' 'self-driven loop:'; do
            zig build test-engine -Dbackend=quickjs_ng -Dquickjs-gc-stress=true -Dtest-filter="$filter" --summary all
          done

      - name: Stress — OOM contracts (quickjs_ng)
        run: zig build test-engine -Dbackend=quickjs_ng -Dtest-filter=OOM --summary all

      - name: Stress — concurrency and lifecycle (quickjs)
        run: zig build test-engine -Dbackend=quickjs -Dstress-tests=true --summary all

      - name: Stress — GC lifecycle contracts (quickjs)
        run: |
          set -euo pipefail
          for filter in 'reference' 'finalizer contract:' 'self-driven loop:'; do
            zig build test-engine -Dbackend=quickjs -Dquickjs-gc-stress=true -Dtest-filter="$filter" --summary all
          done

      - name: Stress — OOM contracts (quickjs)
        run: zig build test-engine -Dbackend=quickjs -Dtest-filter=OOM --summary all

      - name: zev wait/notification contention
        working-directory: libs/zev
        run: zig build stress --summary all

      - name: zev ThreadSanitizer
        working-directory: libs/zev
        run: zig build test stress -Dtsan=true --summary all

      - name: Install Gradle Kotlin compiler and TypeScript
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/gradle-8.7-bin.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP"
          echo "KOTLIN_GRADLE_LIB=$RUNNER_TEMP/gradle-8.7/lib" >> "$GITHUB_ENV"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/jsbay-typescript" typescript@5.6.3
          echo "TSC=$RUNNER_TEMP/jsbay-typescript/node_modules/typescript/lib/tsc.js" >> "$GITHUB_ENV"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_root/include/node/node_api.h"
          echo "NODE_INCLUDE=$node_root/include/node" >> "$GITHUB_ENV"

      - name: Diagnostic and host benchmark contracts
        run: |
          set -euo pipefail
          bash tests/measure_diagnostics_contract.sh
          bash tests/benchmark_source_hash_contract.sh
          bash tests/benchmark_operation_metadata_contract.sh
          bash tests/objc_benchmark_failure_contract.sh
          bash tests/benchmark_interop_contract.sh --host-only

  macos-intel:
    name: macos-intel
    runs-on: macos-26-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Native engine + consumers (quickjs_ng / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs_ng -Doptimize=Debug --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs_ng

      - name: Native engine + consumers (jsc / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=jsc -Doptimize=Debug --summary all
          bash tests/ci/run-desktop-consumers.sh jsc

      - name: zev wait/notification contention
        working-directory: libs/zev
        run: zig build stress --summary all

  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Native engine + consumers (quickjs / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs -Doptimize=Debug -Dinspector-transport=false --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs

      - name: zev wait/notification contention
        working-directory: libs/zev
        run: zig build stress --summary all

  windows-arm:
    name: windows-arm
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Native engine + consumers (quickjs_ng / Debug)
        env:
          JSBAY_CI_OPTIMIZE: Debug
        run: |
          set -euo pipefail
          zig build test-engine -Dbackend=quickjs_ng -Doptimize=Debug -Dinspector-transport=false --summary all
          bash tests/ci/run-desktop-consumers.sh quickjs_ng
