name: Device acceptance

# Already one job per platform on distinct self-hosted runners. workflow_dispatch
# picks exactly one platform, so only one job runs. Do not merge across runners.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Provisioned device runner to use
        type: choice
        options: [android, ios, harmony]
        required: true
      backend:
        description: Engine backend
        type: choice
        options: [quickjs_ng, quickjs]
        default: quickjs_ng

permissions:
  contents: read

concurrency:
  group: device-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: [self-hosted, jsbay-android-device]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run unshrunk and R8 consumers on the connected device
        env:
          QUICKJS_BACKEND: ${{ inputs.backend }}
        run: bash tests/ci/run-android-device-smoke.sh

  ios:
    if: inputs.platform == 'ios'
    runs-on: [self-hosted, macOS, ARM64, jsbay-ios-device]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build, sign and run the current checkout's SDK consumers
        run: bash tests/ci/run-ios-device-smoke.sh ${{ inputs.backend }}

  harmony:
    name: Official Harmony HAR acceptance
    if: inputs.platform == 'harmony'
    runs-on: [self-hosted, jsbay-harmony-sdk12]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build and stage the official SDK HAR
        env:
          QUICKJS_BACKEND: ${{ inputs.backend }}
          HARMONY_TARGET_SDK_VERSION: '5.0.0(12)'
        run: |
          set -euo pipefail
          : "${DEVECO_SDK_HOME:?configure the official SDK}"
          native="$DEVECO_SDK_HOME/default/openharmony/native"
          zig build -Dbackend="$QUICKJS_BACKEND" -Dtarget=aarch64-linux-ohos -Dohos-sysroot="$native/sysroot" -Dlibrary-only=true -Doptimize=ReleaseFast --prefix "$RUNNER_TEMP/harmony-core" --summary all
          export JSBAY_LIBRARY="$RUNNER_TEMP/harmony-core/lib/libjsbay.a"
          export JSBAY_HARMONY_ARCHIVE="$JSBAY_LIBRARY"
          : "${NODE_PATH:?configure the matching Hvigor module root on this runner}"
          bash tests/harmony-sdk/style-consumer.sh
          bash tests/benchmark_interop_contract.sh --arkts-only
          bash scripts/stage-harmony-har.sh "$RUNNER_TEMP/harmony-har" "device-${GITHUB_SHA:0:12}"
      - name: Preserve the validated HAR
        uses: actions/upload-artifact@v4
        with:
          name: harmony-device-har
          path: ${{ runner.temp }}/harmony-har
          if-no-files-found: error
