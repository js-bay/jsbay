  ]]></style>
  <linearGradient id="railGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
    <stop offset="50%" stop-color="#5eead4" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
  </linearGradient>
</defs>
