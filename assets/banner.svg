<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">JS Bay</title>
<desc id="d">JS Bay: embed JS engines on any system — Android, iOS, HarmonyOS, Windows and Linux. Backends: QuickJS, QuickJS-NG, JavaScriptCore, Escargot, Meta Hermes. Official engine marks: WebKit (JSC) and Meta Hermes; others use solid dots. Host marks: see assets/brand-icons/ATTRIBUTION.md.</desc>
<defs>
  <style type="text/css"><![CDATA[
